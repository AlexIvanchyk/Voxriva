[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxriva"
version = "0.1.1"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "pillow==13.0.0",
    "asyncpg==0.31.0",
    "boto3==1.43.123",
    "google-auth[requests]==2.63.1",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "celery[redis]==5.7.0",
    "fastapi==0.136.1",
    "jinja2==3.1.6",
    "jsonschema[format-nongpl]==4.26.0",
    "phonenumbers==9.0.44",
    "pydantic-settings==2.14.2",
    "redis==6.4.0",
    "sqlalchemy[asyncio]==2.0.49",
    "uvicorn==0.46.0",
]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
dev = [
    "mcp==2.3.0",
    "setuptools==80.9.0",
    "httpx==0.28.1",
    "mypy==1.20.2",
    "types-jsonschema==4.26.0.20261006",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: isolated decisions without application database",
    "integration: HTTP, persistence or process integration",
    "postgres: requires TEST_DATABASE_URL and real PostgreSQL semantics",
]

[tool.ruff]
# The local workspace may not be a Git checkout, so .gitignore is insufficient.
# Historical source snapshots and audit tooling remain evidence, not lint inputs.
extend-exclude = [
    "release/**",
    "build/**",
    "*.egg-info",
    "test-results/**",
    "frontend/test-results/**",
    "frontend/playwright-report/**",
    "frontend/blob-report/**",
    "htmlcov/**",
    "coverage/**",
    "secrets/**",
    "backups/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"sdk/python/**" = ["UP017", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true


[[tool.mypy.overrides]]
module = ["celery", "celery.*", "boto3", "boto3.*", "botocore", "botocore.*", "google.auth", "google.auth.*", "google.oauth2", "google.oauth2.*"]
ignore_missing_imports = true
