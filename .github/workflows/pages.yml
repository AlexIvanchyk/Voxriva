name: Documentation Pages

on:
  public:
  push:
    paths:
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.*'
      - 'sdk/python/README.md'
      - 'sdk/python/LICENSE'
      - 'examples/provider-plugin/README.md'
      - 'frontend/src/assets/voxriva-logo.png'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish this strict docs build to GitHub Pages from the default branch'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  trust:
    # Private repository pushes never attempt Pages; an explicit manual deploy
    # reports unavailable Pages clearly instead of changing repository visibility.
    if: github.event_name == 'workflow_dispatch' || (!github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - name: Require this repository's actual default branch
        id: mode
        env:
          SELECTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_DEPLOY: ${{ inputs.deploy }}
        run: |
          test "$SELECTED_REF" = "refs/heads/$DEFAULT_BRANCH"
          if test "$EVENT_NAME" = workflow_dispatch; then
            printf 'deploy=%s\n' "$REQUESTED_DEPLOY" >> "$GITHUB_OUTPUT"
          else
            printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
          fi

  configure:
    needs: trust
    if: needs.trust.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      ready: ${{ steps.result.outputs.ready }}
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Read the existing Pages configuration for deployment only
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Explain unavailable Pages and keep automatic runs as previews
        id: result
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if test "$PAGES_OUTCOME" = success; then
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            message='Pages is unavailable or not configured. After making the repository public, set Settings > Pages > Build and deployment > Source to GitHub Actions, then rerun this workflow with deploy=true. Private repository Pages also requires an eligible GitHub plan. No repository visibility was changed.'
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            if test "$EVENT_NAME" = workflow_dispatch; then
              printf '::error::%s\n' "$message"
              exit 1
            fi
            printf '::warning::%s This automatic run will retain a preview only.\n' "$message"
          fi

  build:
    needs: [trust, configure]
    if: always() && needs.trust.result == 'success' && (needs.configure.result == 'success' || needs.configure.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.lock
      - name: Build strict documentation with the deployment URL when available
        env:
          PAGES_BASE_URL: ${{ needs.configure.outputs.base_url }}
        run: |
          python -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/python" -m pip install -r requirements-docs.lock
          if test -n "$PAGES_BASE_URL"; then
            export VOXRIVA_DOCS_SITE_URL="${PAGES_BASE_URL%/}/"
          fi
          "$RUNNER_TEMP/docs-venv/bin/python" -m mkdocs build --strict --clean --config-file mkdocs.yml --site-dir "$RUNNER_TEMP/docs-site"
      - name: Package the generated site as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/docs-site
          retention-days: 1

  deploy:
    needs: [trust, configure, build]
    if: always() && needs.trust.outputs.deploy == 'true' && needs.configure.outputs.ready == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy this run's documentation artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
