# Disposable fictional-data demonstration; never merge with a real stack.
name: voxriva-mcp-smoke
x-env: &env
  VOXRIVA_DATABASE_URL: postgresql+asyncpg://voxriva:synthetic-only@postgres:5432/voxriva
  OPENSSL_armcap: "0"
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voxriva
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: voxriva
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U voxriva -d voxriva"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    image: voxriva-mcp:authoring-check
    environment: *env
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: voxriva-mcp:authoring-check
    environment:
      <<: *env
      VOXRIVA_SECURE_SESSION_COOKIE: "false"
    command: [uvicorn, "backend.app.main:app", --host, "0.0.0.0", --port, "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 2s
      timeout: 3s
      retries: 30
  mcp:
    image: voxriva-mcp:authoring-check
    environment:
      <<: *env
      VOXRIVA_MCP_PUBLIC_URL: http://mcp:8001/mcp
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import http.client; c=http.client.HTTPConnection('127.0.0.1',8001,timeout=2); c.request('GET','/mcp'); assert c.getresponse().status == 401"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
networks:
  default:
    internal: true
