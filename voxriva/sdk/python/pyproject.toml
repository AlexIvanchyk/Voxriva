[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxriva-sdk"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Typed synchronous and asynchronous clients for Voxriva notifications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxriva_sdk = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["voxriva_sdk"]
