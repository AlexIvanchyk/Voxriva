# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Voxriva
site_description: Open-source, self-hosted email and push with a web dashboard, HTTP API, Python SDK and MCP.
repo_url: https://github.com/AlexIvanchyk/Voxriva
repo_name: AlexIvanchyk/Voxriva
site_url: !ENV [VOXRIVA_DOCS_SITE_URL, 'http://127.0.0.1:8008/']
docs_dir: docs
site_dir: build/docs
use_directory_urls: true
strict: true
copyright: Copyright © 2026 Voxriva contributors · Own code and documentation licensed under MIT

# Public Pages identity remains unset until its hosting URL is assigned.
# CI may provide the exact Pages base URL through VOXRIVA_DOCS_SITE_URL.
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false
  logo: assets/brand/voxriva-logo.png
  palette:
    scheme: default
    primary: custom
    accent: indigo
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    admonition:
      note: material/information-outline
      tip: material/lightbulb-outline
      warning: material/alert-outline

plugins:
  - search:
      lang: en
hooks:
  - docs/_hooks/canonical.py
exclude_docs: |
  /_hooks/
  /overrides/
extra_css:
  - assets/stylesheets/voxriva.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Overview:
      - Meet Voxriva: index.md
      - Product capabilities: capabilities.md
      - Release status and compatibility: release-status.md
      - 0.1.0 source prerelease: releases/0.1.0.md
  - Run locally:
      - Quickstart and first email: quickstart.md
      - Local example reference: evaluate.md
  - Dashboard:
      - Content and delivery tour: dashboard.md
      - Projects, members and keys: journeys/workspace.md
      - Complete editor reference: workspace-guide.md
      - MFA policy and recovery: mfa.md
  - API & SDK:
      - API and Python SDK: journeys/integrate.md
      - Delivery HTTP contract: api.md
      - Credentials and scopes: credentials.md
      - Python SDK reference: sdk.md
      - Push integration: journeys/push.md
  - MCP:
      - Connect and preview drafts: journeys/mcp.md
      - Tools and transport reference: mcp.md
  - Templates:
      - Typed payload and rendering: journeys/email.md
      - Version resolution and concurrency: journeys/lifecycle.md
      - Languages and sharing: journeys/languages.md
      - Variable formats: variable-formats.md
      - Image v1: email-images.md
      - Limits: limits.md
  - Self-hosting:
      - Installation and requirements: self-hosting.md
      - Configuration: configuration.md
      - Acceptance, delivery and recovery: journeys/operate.md
      - Provider configuration reference: delivery-guide.md
      - Production install, backup and upgrade: production.md
      - Local infrastructure: local-infrastructure.md
  - Community:
      - Contribute and get help: community.md
      - Contribution guide: contributing.md
      - Support: support.md
      - Security reporting: security.md
      - Code of Conduct: code-of-conduct.md
      - Changelog: changelog.md
      - Documentation build: contributing/documentation.md
  - Reference:
      - Runtime architecture: journeys/model.md
      - Development and tests: development.md
      - Code architecture: architecture.md
      - Provider plugin example: reference/provider-plugin.md
      - MIT license: license.md
      - Documentation asset licenses: documentation-licenses.md
      - Third-party review: third-party.md
