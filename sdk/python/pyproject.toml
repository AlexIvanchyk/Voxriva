[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxriva-sdk"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Typed synchronous and asynchronous clients for Voxriva notifications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://alexivanchyk.github.io/Voxriva/journeys/integrate/"
Repository = "https://github.com/AlexIvanchyk/Voxriva"
Issues = "https://github.com/AlexIvanchyk/Voxriva/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxriva_sdk = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["voxriva_sdk"]
